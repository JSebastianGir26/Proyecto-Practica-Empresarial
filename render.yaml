# Configuracion del backend en Render (Blueprint).
# En Render: New > Blueprint > elegir este repositorio.
# Los valores marcados con "sync: false" se llenan a mano en el panel
# de Render; NUNCA se escriben en este archivo (es publico).
services:
  - type: web
    name: practiya-api
    runtime: python
    plan: free
    rootDir: backend
    branch: main
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /admin/login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # cadena "Session pooler" de Supabase
      - key: CORS_ALLOWED_ORIGINS
        sync: false # https://<tu-proyecto>.vercel.app
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        sync: false # ^https://<tu-proyecto>-[a-z0-9-]+\.vercel\.app$
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_REGION
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_BUCKET
        value: practiya
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
