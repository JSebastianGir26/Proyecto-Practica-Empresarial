# Pruebas automáticas: corren en cada Pull Request y en cada cambio
# a develop o main. Si fallan, el PR no se puede unir (ver
# docs/DESPLIEGUE.md, sección 6).
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Revisar estilo (flake8)
        run: flake8
      - name: Verificar que no falten migraciones
        run: python manage.py makemigrations --check --dry-run
      - name: Pruebas (pytest)
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Revisar estilo (ESLint)
        run: npm run lint
      - name: Compilar
        run: npm run build
